services:
  postgres:
    image: postgres:16
    container_name: splitexpense-db
    environment:
      POSTGRES_USER: splitexpense
      POSTGRES_PASSWORD: ${DB_PASSWORD:-splitexpense}
      POSTGRES_DB: splitexpense_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitexpense"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [splitexpense]

  redis:
    image: redis:7-alpine
    container_name: splitexpense-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [splitexpense]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: splitexpense-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [splitexpense]

  auth-service:
    build: ./auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/splitexpense_auth
      DB_USERNAME: splitexpense
      DB_PASSWORD: ${DB_PASSWORD:-splitexpense}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [splitexpense]

  group-service:
    build: ./group-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/splitexpense_group
      DB_USERNAME: splitexpense
      DB_PASSWORD: ${DB_PASSWORD:-splitexpense}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [splitexpense]

  expense-service:
    build: ./expense-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/splitexpense_expense
      DB_USERNAME: splitexpense
      DB_PASSWORD: ${DB_PASSWORD:-splitexpense}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTH_SERVICE_URL: http://auth-service:8081
      GROUP_SERVICE_URL: http://group-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Must be a pre-registered ADMIN account in auth-service — it is what
      # expense-service authenticates as when applying balance deltas to
      # group-service's internal endpoints. The password needs a digit to pass
      # RegisterRequest's own validation, which the in-code default lacks.
      SERVICE_ACCOUNT_EMAIL: expense-service@splitexpense.internal
      SERVICE_ACCOUNT_PASSWORD: dev-service-account-password-change-me-1
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [splitexpense]

  notification-service:
    build: ./notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/splitexpense_notification
      DB_USERNAME: splitexpense
      DB_PASSWORD: ${DB_PASSWORD:-splitexpense}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    networks: [splitexpense]

  api-gateway:
    build: ./api-gateway
    ports:
      # The ONLY published port. Configurable because 8080 is a common
      # default that collides with other local services; override with
      # GATEWAY_PORT in .env if 8090 isn't free either.
      - "${GATEWAY_PORT:-8090}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTH_SERVICE_URL: http://auth-service:8081
      GROUP_SERVICE_URL: http://group-service:8082
      EXPENSE_SERVICE_URL: http://expense-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      REDIS_HOST: redis
    depends_on: [auth-service, group-service, expense-service, notification-service]
    networks: [splitexpense]

volumes:
  pgdata:
  redisdata:

networks:
  splitexpense:
    driver: bridge
